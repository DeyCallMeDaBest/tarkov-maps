<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarkov Tactical Maps — All Maps · Real Imagery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2330; --line:#2b3648;
    --text:#dbe4f0; --dim:#8b98ab; --accent:#c8aa6e;
    --extract:#4ade80; --scavx:#7dd3fc; --shared:#38bdf8; --vex:#f59e0b; --transit:#a78bfa;
    --quest:#fbbf24; --qapi:#fde047; --key:#22d3ee; --loot:#fb923c; --hazard:#f87171;
    --gun:#facc15; --spawn:#e2e8f0; --land:#f472b6; --pin:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(180deg,#151a23,#10141b);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:17px;letter-spacing:2px;font-weight:800;color:#fff;white-space:nowrap}
  header h1 span{color:var(--accent)}
  #mappick{display:flex;gap:5px;flex-wrap:wrap}
  .mp{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--panel);color:var(--dim);white-space:nowrap}
  .mp.on{color:#0b0e13;background:var(--accent);border-color:var(--accent);font-weight:700}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .chip{font-size:11px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--dim);background:var(--panel)}
  .chip b{color:var(--text)}
  #toggles{display:flex;gap:6px;padding:7px 16px;background:#11151d;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
  .tg{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;user-select:none;background:var(--panel);color:var(--dim)}
  .tg .dot{width:9px;height:9px;border-radius:3px}
  .tg.on{color:var(--text);border-color:#3d4d66;background:var(--panel2)}
  .tg:not(.on){opacity:.45}
  .tool{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--panel);color:var(--dim);margin-left:4px}
  .tool.on{color:#0b0e13;background:#7dd3fc;border-color:#7dd3fc;font-weight:700}
  .floorlbl{font-size:11px;color:var(--dim);margin-left:8px;text-transform:uppercase;letter-spacing:1px}
  .fl{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--panel);color:var(--dim)}
  .fl.on{color:#0b0e13;background:var(--accent);border-color:var(--accent);font-weight:700}
  #main{display:flex;flex:1;min-height:0}
  #side{width:305px;min-width:305px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px}
  #side::-webkit-scrollbar{width:8px}#side::-webkit-scrollbar-thumb{background:#2b3648;border-radius:4px}
  #search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#10141b;color:var(--text);font-size:13px;margin-bottom:10px;outline:none}
  #search:focus{border-color:#3d4d66}
  .sec{margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
  .sec h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;color:var(--accent)}
  .sec h2::after{content:"▾";color:var(--dim)}
  .sec.closed h2::after{content:"▸"}
  .sec.closed .body{display:none}
  .sec .body{padding:2px 6px 8px}
  .item{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:6px;cursor:pointer;font-size:12.5px}
  .item:hover{background:#232c3d}
  .item.hid{display:none}
  .item .ic{flex:none;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#0b0e13;margin-top:1px}
  .item .t b{display:block;font-size:12.5px}
  .item .t small{color:var(--dim);font-size:11px}
  .note{font-size:11.5px;color:var(--dim);padding:4px 8px 6px;line-height:1.5}
  .note b{color:var(--text)}
  .note em{color:var(--quest);font-style:normal}
  .lvlrow{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11.5px;color:var(--dim)}
  .lvlrow input{width:56px;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:#10141b;color:var(--text)}
  #map{flex:1;background:#0d1017}
  .leaflet-container{background:#0d1017;font:inherit}
  #mapwrap{flex:1;position:relative;display:flex}
  #detail{position:absolute;right:12px;bottom:34px;width:330px;max-height:52%;overflow-y:auto;background:rgba(20,26,36,.97);border:1px solid #3d4d66;border-radius:10px;padding:14px;display:none;z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:width .15s}
  #detail.wide{width:min(580px,62%);max-height:88%;top:12px;bottom:auto}
  .gimg{width:100%;border:1px solid var(--line);border-radius:8px;margin:8px 0 3px;display:block;background:#0d1117;min-height:40px}
  .gcap{font-size:11px;color:var(--dim);margin-bottom:6px}
  .dosbtn{padding:5px 10px;border:1px solid #7a6a3a;background:#2c2410;color:#ffe9a8;border-radius:6px;cursor:pointer;font-size:12px;margin:4px 6px 0 0}
  #detail.open{display:block}
  #detail .cat{font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:6px;font-weight:700;color:#0b0e13}
  #detail h3{font-size:16px;margin-bottom:6px;color:#fff}
  #detail p{font-size:12.5px;color:#b9c5d6;margin-bottom:6px}
  #detail p b{color:var(--text)}
  #detail a{color:#7dd3fc}
  #detail .close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer}
  #detail button.del{margin-top:4px;padding:4px 10px;border:1px solid #7a3a3a;background:#3a1f1f;color:#f0c0c0;border-radius:6px;cursor:pointer;font-size:12px}
  #netwarn{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:8px 32px 8px 14px;border-radius:8px;font-size:12px;z-index:1001;display:none;max-width:80%;line-height:1.5;border:1px solid #46523c;background:#1d2418;color:#cfe3b8}
  #netwarn.nw-info{background:#1d2418;border-color:#46523c;color:#cfe3b8}
  #netwarn.nw-warn{background:#2c2414;border-color:#8a763a;color:#f0e0b0}
  #netwarn.nw-err{background:#3a1f1f;border-color:#7a3a3a;color:#f0c0c0}
  .nwx{position:absolute;right:9px;top:7px;cursor:pointer;opacity:.65;font-weight:700}
  .nwx:hover{opacity:1}
  #loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--dim);font-size:13px;z-index:999;background:rgba(14,17,22,.85);padding:10px 18px;border-radius:8px;display:none}
  #coords{position:absolute;left:10px;bottom:10px;z-index:1000;font-size:11px;color:var(--dim);background:rgba(22,27,34,.85);padding:3px 8px;border-radius:6px}
  #focusbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:1001;background:rgba(30,26,10,.95);border:1.5px solid var(--quest);color:#ffe9a8;padding:8px 14px;border-radius:8px;font-size:12.5px;display:none;max-width:82%;text-align:center}
  #focusbar u{cursor:pointer;margin-left:8px}
  #measureout{position:absolute;left:10px;bottom:34px;z-index:1000;font-size:12px;color:#7dd3fc;background:rgba(22,27,34,.9);padding:4px 10px;border-radius:6px;display:none}
  .compass{position:absolute;right:14px;top:14px;z-index:1000;width:66px;height:66px;border-radius:50%;background:rgba(22,27,34,.9);border:1.5px solid #3d4d66;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .iico{width:38px;height:38px;object-fit:contain;border:1px solid var(--line);border-radius:5px;background:#10141b;flex:none}
  #omniwrap{position:relative;flex:1;min-width:180px;max-width:420px}
  #omni{width:100%;padding:7px 12px;border:1px solid #3d4d66;border-radius:8px;background:#0d1117;color:var(--text);font-size:13px;outline:none}
  #omni:focus{border-color:var(--accent)}
  #omnires{position:absolute;top:36px;left:0;right:0;z-index:3000;background:#151b26;border:1px solid #3d4d66;border-radius:10px;max-height:60vh;overflow-y:auto;display:none;box-shadow:0 10px 34px rgba(0,0,0,.6)}
  #omnires .gh{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);padding:8px 10px 2px}
  #omnires .item{padding:7px 10px}
  .popbtn{position:relative}
  .pop{position:absolute;top:38px;left:0;z-index:2900;background:#151b26;border:1px solid #3d4d66;border-radius:10px;padding:8px;display:none;box-shadow:0 10px 34px rgba(0,0,0,.6);min-width:230px}
  .pop.open{display:flex;flex-wrap:wrap;gap:6px}
  .pop .tg,.pop .tool{margin:0}
  #menubtn{display:none;font-size:20px;padding:4px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer;margin-right:4px}
  @media(max-width:860px){
    #menubtn{display:block}
    header h1{font-size:15px;letter-spacing:1px}
    .sub,.chips{display:none}
    #main{position:relative}
    #side{position:absolute;left:0;top:0;bottom:0;z-index:1500;width:86%;min-width:0;max-width:340px;transform:translateX(-105%);transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.6)}
    #side.open{transform:translateX(0)}
    .tg,.tool,.fl,.mp{padding:7px 12px;font-size:13px}
    #toggles{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
    #mappick{overflow-x:auto;flex-wrap:nowrap;max-width:70vw;-webkit-overflow-scrolling:touch}
    #detail{width:92%;left:4%;right:auto;max-height:45%}
    .ctl button{width:42px;height:42px;font-size:20px}
  }
  .youdot{width:46px;height:46px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#22d3ee;font-size:9px;font-weight:900;text-shadow:0 1px 3px #000;background:radial-gradient(circle,rgba(34,211,238,.35) 0%,rgba(34,211,238,.05) 65%);border:2px solid #22d3ee;animation:youpulse 1.6s infinite}
  .youarrow{font-size:14px;line-height:1;color:#7ff3ff}
  @keyframes youpulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}70%{box-shadow:0 0 0 16px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
  .selring{width:46px;height:46px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 16px rgba(255,255,255,.9),inset 0 0 12px rgba(255,255,255,.5);animation:selpulse 1s infinite}
  @keyframes selpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.55}}
  .exring{width:38px;height:38px;border:3px solid #fbbf24;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fbbf24;text-shadow:0 1px 2px #000;background:rgba(251,191,36,.15);box-shadow:0 0 14px rgba(251,191,36,.7);animation:selpulse 1.2s infinite}
  .compass .arrow{font-size:20px;color:var(--accent);line-height:1}
  .compass small{font-size:8.5px;color:var(--dim);text-align:center;line-height:1.15}
  .mk{display:flex;align-items:center;justify-content:center;font-weight:900;color:#0b0e13;border:1.6px solid #0b0e13;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  .mk.sq{border-radius:5px;font-size:12px}
  .mk.rd{border-radius:50%;font-size:10px}
  .mk.dm{transform:rotate(45deg);border-radius:3px}
  .mk.tri{background:none!important;border:none!important;box-shadow:none;font-size:20px;color:var(--hazard);text-shadow:0 1px 2px #000}
  .mk.star{background:none!important;border:none!important;box-shadow:none;font-size:19px;color:var(--quest);text-shadow:0 1px 3px #000}
  .mk.qz{border-radius:50%;background:rgba(253,224,71,.25)!important;border:2px solid var(--qapi);color:var(--qapi);font-size:10px;text-shadow:0 1px 2px #000}
  .mk.sp{border-radius:50%;font-size:8px}
  .mk.em{background:none!important;border:none!important;box-shadow:none;font-size:17px;text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.9)}
  #viewnav{display:flex;gap:4px;margin-left:10px}
  .vtab{font-size:12.5px;padding:5px 13px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel);color:var(--dim);white-space:nowrap}
  .vtab.on{color:#0b0e13;background:var(--accent);border-color:var(--accent);font-weight:800}
  #main{position:relative}
  body.paged #toggles{display:none}
  body.paged #side{display:none}
  #page{position:absolute;inset:0;z-index:1200;background:radial-gradient(1100px 500px at 75% -8%,rgba(154,136,102,.09),transparent),var(--bg);display:none;overflow-y:auto;padding:0 0 70px}
  #page.open{display:block}
  .pwrap{max-width:1500px;margin:0 auto;padding:16px 26px}
  #page h2{font-size:21px;font-weight:800;color:#e8e2d0;letter-spacing:3px;text-transform:uppercase;margin:20px 0 3px;border-bottom:1px solid #4a4638;padding-bottom:8px}
  #page .psub{color:var(--dim);font-size:12.5px;margin-bottom:12px;line-height:1.5}
  .pfind{width:100%;max-width:460px;background:#12150f;border:1px solid #3c4436;border-radius:8px;color:#e6ecdf;padding:8px 12px;font-size:13px;margin:6px 0 12px;outline:none}
  .pfind:focus{border-color:#9a8866}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:20px}
  .pcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .pcard h3{font-size:14.5px;color:#fff;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .pcard p{font-size:12.5px;color:#b9c5d6;line-height:1.55}
  .pcard .tb,.tb{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:7px;font-weight:900;color:#0b0e13;padding:0 6px}
  .tierrow{display:flex;gap:14px;margin:16px 0;align-items:stretch}
  .tbadge{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:900;border-radius:10px;color:#0b0e13;letter-spacing:0}
  .tbadge small{font-size:9px;font-weight:800;letter-spacing:1px}
  .tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:12px;flex:1}
  .icard{background:linear-gradient(180deg,#161a15,#101309);border:1px solid #363c2e;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .icard .ihead{background:linear-gradient(90deg,#242a1e,#181c12);padding:8px 12px;font-weight:800;color:#e8e2d0;font-size:13.5px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #363c2e;letter-spacing:.3px}
  .icard .iimg{min-height:88px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px),#0b0e09;padding:10px}
  .icard .iimg img{max-height:96px;max-width:96%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.85))}
  .icard .ibody{padding:10px 12px;font-size:12.5px;color:#b9c5d6;line-height:1.55;flex:1}
  .statr{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:11px;color:#93a1b5}
  .statr b{min-width:78px;font-weight:700;color:#c9d4e3;text-transform:uppercase;letter-spacing:.6px;font-size:9.5px}
  .statr em{font-style:normal;min-width:34px;text-align:right;color:#e6ecdf;font-weight:700}
  .sbar{flex:1;height:7px;background:#1e2318;border-radius:4px;overflow:hidden}
  .sbar i{display:block;height:100%;border-radius:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#191e14;border:1px solid #3c4436;border-radius:6px;padding:3px 8px;font-size:11px;color:#cfd8c9;margin:3px 5px 0 0;vertical-align:middle}
  .chip img{width:24px;height:24px;object-fit:contain}
  .buyat{color:#9fd08a;font-weight:700}
  .clsb{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;border-radius:5px;background:#2c3327;color:#cfe3b8;font-weight:900;font-size:12px;border:1px solid #46523c;padding:0 4px}
  .tree{list-style:none;margin:4px 0 0;padding-left:0}
  .tree ul{list-style:none;padding-left:22px;position:relative;margin:0}
  .tree ul::before{content:'';position:absolute;left:8px;top:0;bottom:12px;border-left:1px solid #46523c}
  .tree li{position:relative;padding:3px 0}
  .tree ul li::before{content:'';position:absolute;left:-14px;top:14px;width:12px;border-top:1px solid #46523c}
  .slot{color:#9a8866;font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;min-width:74px;display:inline-block}
  .kitline{margin-top:8px;padding:8px 10px;background:rgba(154,136,102,.08);border-left:3px solid #9a8866;border-radius:0 6px 6px 0;font-size:12px;color:#d8d2c0;line-height:1.5}
  @media(max-width:860px){#viewnav{order:5;width:100%;overflow-x:auto}}
  .mk.pin{background:none!important;border:none!important;box-shadow:none;font-size:22px;color:#fff;text-shadow:0 1px 3px #000}
  .mklab{position:absolute;left:24px;top:2px;white-space:nowrap;color:#fff;font-size:11.5px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 2px #000}
  .plabel{color:#a9bad2;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 4px #000,0 0 4px #000,0 1px 3px #000;opacity:.9;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<header>
  <div id="menubtn" onclick="document.getElementById('side').classList.toggle('open')">☰</div>
  <h1>TARKOV <span>MAPS</span></h1>
  <div id="viewnav">
    <div class="vtab on" data-v="map">🗺 Map</div>
    <div class="vtab" data-v="weapons">🔫 Weapons</div>
    <div class="vtab" data-v="ammo">🎯 Ammo</div>
    <div class="vtab" data-v="gear">🛡 Gear</div>
    <div class="vtab" data-v="builds">🔧 Builds</div>
    <div class="vtab" data-v="bosses">⚔ Bosses</div>
    <div class="vtab" data-v="hideout">🏠 Hideout</div>
    <div class="vtab" data-v="money">💰 Money</div>
    <div class="vtab" data-v="kit">🎒 My Kit</div>
  </div>
  <div id="mappick"></div>
  <div class="chips" id="metachips"></div>
</header>
<div id="toggles"></div>
<div id="main">
  <aside id="side"></aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="page"></div>
    <div id="netwarn"></div>
    <div id="loading">Loading map data…</div>
    <div id="coords"></div>
    <div id="focusbar"></div>
    <div id="measureout"></div>
    <div class="compass"><div class="arrow" id="cArrow">▲</div><small id="cTxt">N</small></div>
    <div id="detail">
      <button class="close" onclick="closeDetail()">✕</button>
      <span class="cat" id="dcat"></span>
      <h3 id="dtitle"></h3>
      <div id="dbody"></div>
    </div>
  </div>
</div>
</div>
<script>
"use strict";
/* ============ MAP CONFIGS (from tarkov.dev maps.json) ============ */

{gx:19.5,gz:26,cat:"loot",g:"$",name:"Rasmussen / tech row",sub:"More tech spawns",body:"<p>Second tech store cluster near Techlight's level — worth sweeping in the same loop.</p>"},
{gx:18,gz:-103,cat:"loot",g:"$",name:"EMERCOM medical unit",sub:"Med loot & medcase",body:"<p>Medical store on the main shop floor — meds, medcase spawns. Quick stop between IDEA and center.</p>"},
{gx:-28,gz:140,cat:"loot",g:"$",name:"OLI hardware",sub:"Hideout heaven",body:"<p>Hardware superstore: <b>bolts, screw nuts, hoses, tools, fuel</b> — the single best aisle-run for hideout items in the game. Check the racks and the OLI logistics offices.</p>"},
{gx:-115,gz:-45,cat:"loot",g:"$",name:"Goshan",sub:"Food anchor · Killa lane",body:"<p>Grocery anchor store: food, drink, registers along the front. <b>Killa patrols the central lanes</b> around here — listen before crossing the open aisles.</p>"},
{gx:-34,gz:-235,cat:"loot",g:"$",name:"IDEA",sub:"Office-type loot",body:"<p>Furniture anchor: drawers, office loot, registers; quieter than center mall most raids.</p>"},
{gx:263,gz:-11,cat:"loot",g:"$",name:"Scav camp",sub:"Loot + co-op extract",body:"<p>Scav camp on the east side — loose loot and the Scav Camp co-op extract. AI Scavs cluster here.</p>"},
{gx:-186.4,gz:-318.7,cat:"land",g:"◆",name:"Power Station (main breaker)",sub:"Saferoom step 1 · V-Ex nearby",body:"<p>Flip the <b>main breaker</b> here to power the mall — step 1 of the <b>Saferoom extract</b> (and it powers store shutters/alarms). The Power Station V-Ex car is just outside. Killa never comes out here.</p>"},
{gx:-27,gz:-103,cat:"land",g:"◆",name:"Burger Spot — Saferoom entrance",sub:"Urinal → keypad → 11SR keycard",body:"<p>With power ON: go to the <b>men's toilet in Burger Spot</b>, <b>flush the urinal</b> to reveal a hidden keypad, swipe the <b>Object #11SR keycard</b> → the Saferoom opens (extract inside, plus the switch for the Object #14 container). Not a beginner extract — practice the route offline first.</p>"},

{gx:250,gz:-25,cat:"quest",g:"★",name:"Break the Deal (Ragman) — DVL stash spot",sub:"Old construction / plant corner · exact zones",body:"<p>Stash the <b>DVL-10 sniper rifle</b> at the marked spot — the game data shows a tight cluster of plant points <b>right here at the old-construction corner of the industrial plant</b> (just north of your Provide Viewership camera building). Bring the DVL (doesn't need FIR — buy/build it), hold F on the stash spot, ~30s plant.</p><p>Combo raid: plant the DVL, then do your four 📷 cameras next door.</p>"},

{gx:174,gz:148,cat:"key",g:"🚪",badge:"🗄",name:"Overseer stash room (209↔211)",sub:"2F, 3-story dorms · Dorm overseer key",body:"<p><b>The Dorm overseer key door</b> — 2nd floor of the 3-STORY dorms, the unmarked stash room <b>between rooms 209 and 211</b>.</p><p>Inside: loose valuables / weapon loot — a quick, quiet payday while everyone else fights over 3F.</p><p><b>Where the key comes from:</b> ONE spawns <b>guaranteed every raid at the Scav Farm on Shoreline</b> (💎 marker there lists the three exact spots: red-container desk, warehouse bed, tent ashtray) — plus rare scav pockets/jackets.</p><p>⚠ Key is fragile: <b>breaks after a couple of uses</b>. Open, loot, leave.</p>"},
{gx:176,gz:150.3,cat:"quest",g:"🚪",badge:"🚪",name:"ROOM 303",sub:"Golden Swag — 3rd floor, 3-story dorms",body:"<p><b>This exact door.</b> Third floor of the <b>3-STORY dorms</b> (the bigger dorm building). Up the stairwell to 3F, room 303 — <b>Golden Zibbo lighter on the desk</b> (only spawns while Golden Swag is active).</p><p>Needs the <b>Dorm room 303 key</b> — see the two ♦ key-spawn markers east, or buy it cheap on flea (live price on the 303 lock marker right here).</p><p>⚠ Dorms 3F is the most-fought hallway on Customs. Clear sound before opening; the lighter goes to your quest inventory, so once grabbed, only extraction greed can hurt you.</p>"},
{gx:590,gz:-8,cat:"gem",g:"♦",name:"303 key spawn — Tigr vehicle",sub:"East military checkpoint · approx.",body:"<p><b>Dorm room 303 key</b> (Golden Swag) can spawn <b>inside the Tigr armored vehicle</b> parked at the east military checkpoint, by the Scav Checkpoint corner. Check the seats/interior. <i>Marker approximate to a few meters — the Tigr is unmissable at the checkpoint.</i></p>"},
{gx:478,gz:-60,cat:"gem",g:"♦",name:"303 key spawn — Warehouse 6 tool cabinet",sub:"Depot / fuel silos · approx.",body:"<p>Second <b>Dorm room 303 key</b> spawn: <b>Warehouse 6 by the Depot fuel silos</b> — go to the <b>2nd floor, north side</b>, and check the <b>hanging tool cabinet</b> on the wall. <i>Marker approximate within the warehouse.</i></p><p>Also: jackets, drawers and Scav pockets anywhere — or buy it cheap on flea (see the 303 lock marker for live price).</p>"},

{gx:99,gz:-71,cat:"key",g:"K",name:"Cardinal apartment key — apt 2 (secret)",sub:"Cardinal Apartments high-rise · 2F · 1.0 secret",body:"<p><b>Official wiki name: Cardinal apartment key</b> — 'an apartment in a luxury residential complex that once housed TerraGroup's senior executives.' Opens <b>apartment 2 AND its locked bedroom, 2nd floor of the Cardinal Apartments complex</b> (this high-rise — the one with the parking-garage Scav extract beneath it).</p><p><b>Getting the key:</b> per the wiki, one is <b>guaranteed to spawn every raid in the safe inside Kruglov's office</b> — community reports place that office in the Lab's new secret area (Black Keycard to enter, Keycard with a blue marking for the safe). This is endgame-chain content.</p><p><b>Inside the complex:</b> additional safes including one hidden <b>behind a wall painting</b> (interact with the painting → keypad → Black Keycard); bitcoin-tier loot reported.</p><p><i>1.0 secret content — not yet in live lock data, hand-mapped. Related new items to watch for: 'Keycard with a blue marking', 'Reprogrammed keycard for A.P.'s apartment lock (Green)', 'TerraGroup corporate apartment key'. Report corrections from the field and I'll refine.</i></p>"},

{gx:450,gz:-300,cat:"extract",g:"P",name:"Path to River (Flare)",sub:"1.0 extract · GREEN FLARE · marker approximate",body:"<p><b>Another 1.0 extract the live database doesn't carry yet</b> — marker approximate: it sits at the new <b>Smuggler's Camp</b> in the expanded outdoor area (the same camp where the <b>Missing in Action</b> quest stash spawns), on the path down to the river.</p><p><b>HOW TO USE:</b> stand in the zone and fire a <b>GREEN FLARE</b> into the sky — the countdown starts when the flare goes up. Bring the flare in your rig; no other requirement, no item consumed except the flare.</p><p>Pairs well with the Smugglers' Tunnel marker nearby — both live in the expanded band past the rail yard. When the community database adds them, exact live markers replace these automatically.</p>"},
{gx:505,gz:-395,cat:"extract",g:"S",name:"Smugglers' Tunnel (conditional)",sub:"1.0 extract · needs Utility Plan + green flare · marker approximate",body:"<p><b>New 1.0 extract the live map data doesn't carry yet</b> — that's why it wasn't marked. Marker is <b>approximate</b>: it's in the expanded outdoor area past the rail yard — climb through the <b>freight containers / idle trains</b> near Railway Exfil, exit them, turn left and follow the <b>upward slope</b> to the tunnel by the <b>blue container</b>.</p><p><b>HOW IT WORKS (two parts):</b><br>① It only appears in your exit list when someone in the raid is carrying the <b>Interchange underground utility plan</b> — an 'extraction intel' item found as loose paper loot in-raid. It <b>cannot be taken out of a raid</b>, so it activates the tunnel for THAT raid only.<br>② In the zone, your HUD shows a <b>Signal Flare</b> indicator: fire a <b>green flare</b> into the air to start the extraction countdown. Bring one if you're hunting this exit.</p><p>So: no plan in the squad = no tunnel in the list. If you saw it once and not again, that's the plan item, not a bug.</p>"},

/* requirement inference for any extract without a curated note — covers future patches too */
function extractReq(name,faction){
  const n=(name||'').toLowerCase();
  if(/v-ex|vehicle/.test(n))return 'PAID CAR — bring roubles (≈5–8k, price varies), pay at the vehicle. 60s countdown, ONE use per raid, limited seats: first come, first served.';
  if(/co-?op/.test(n))return 'CO-OP EXIT — a PMC and a player-Scav must stand in it together. Solo PvE: treat it as unavailable.';
  if(/flare/.test(n))return 'SIGNAL EXIT — stand in the zone and fire a GREEN flare into the sky to start the timer.';
  if(/manhole|vent|shaft|hole in the fence|sewer/.test(n))return 'TIGHT SQUEEZE — NO backpack allowed. Drop it or hand it to a friend first.';
  if(/cliff|climber|mountain pass/.test(n))return 'CLIMBING EXIT — Red Rebel ice pick + Paracord in the special slot, NO armored vest equipped.';
  if(/train/.test(n))return 'ARMORED TRAIN — arrives late in the raid with a horn, waits ~7 minutes, second horn = doors closing. Be inside a wagon.';
  if(/boat|pier/.test(n))return 'SOMETIMES ACTIVE — open only in a random share of raids, no item needed. Green flares burning at the spot = open; "access denied" = not this raid.';
  if(faction==='scav')return 'Scav-only exit — not usable on your PMC.';
  return 'No special requirement known — stand in the zone and the timer runs. If it says "ACCESS DENIED", the exit simply isn\'t active this raid (several are random or spawn-side gated) — your real list is double-tap O at raid start.';
}

/* storage-safe cache writer: if localStorage is full, evict legacy/bulky caches (NEVER user data) and retry.
   A silently-full storage is worse than it sounds: nothing caches, every view refetches, the API rate-limits you forever. */
const KEEP_KEYS=/^tkm_(pins|dead|routes|rdead|done|qdone|squad|name|lvl|layers|last)$/;
function safeSet(k,v){
  try{safeSet(k,v);return;}catch(e){}
  try{
    const kill=[];
    for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);
      if(!key||key===k||KEEP_KEYS.test(key))continue;
      if(/^tkm_(c3_|c4_|tasks$|hide2$|ammo2$|loot1$|gear1$)/.test(key))kill.push(key);}
    kill.forEach(x=>localStorage.removeItem(x));
    localStorage.setItem(k,v);return;
  }catch(e){}
  try{
    const kill=[];
    for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);
      if(key&&key!==k&&/^tkm_c5_/.test(key))kill.push(key);}
    kill.forEach(x=>localStorage.removeItem(x));
    localStorage.setItem(k,v);
  }catch(e){console.warn('localStorage full — could not cache',k);}
}
/* one-time boot cleanup: purge obsolete cache generations so storage never silently fills */
(function(){try{
  const kill=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);if(!k)continue;
    if(/^tkm_(c3_|tasks$|hide2$|ammo2$|loot1$)/.test(k))kill.push(k);
    if(/^tkm_c4_/.test(k)&&packGet('tkm_c5_'+k.slice(7)))kill.push(k);
  }
  kill.forEach(k=>localStorage.removeItem(k));
}catch(e){}})();

function fitsCell(gr,w,h){return (gr||[]).some(([gw,gh])=>(gw>=w&&gh>=h)||(gw>=h&&gh>=w));}
/* "2× 1×3 · 4× 1×2 · 6× 1×1" summary of a container's cells */
function gridSum(gr){
  if(!gr||!gr.length)return '';
  const m={};gr.forEach(([w,h])=>{const k=Math.min(w,h)+'×'+Math.max(w,h);m[k]=(m[k]||0)+1;});

}

/* resolve many exact item names in a couple of aliased requests (for builds page) */
async function batchItems(names){
  const need=[...new Set(names)].filter(n=>n&&!itemCache.has('b:'+n));
  for(let i=0;i<need.length;i+=8){
    const chunk=need.slice(i,i+8);
    const q='{'+chunk.map((n,j)=>`x${j}:items(name:${JSON.stringify(n)},limit:1){name shortName iconLink avg24hPrice buyFor{priceRUB vendor{name ...on TraderOffer{minTraderLevel}}} properties{...on ItemPropertiesWeaponMod{ergonomics recoilModifier} ...on ItemPropertiesScope{ergonomics}}}`).join(' ')+'}';
    try{const r=await gql(q);chunk.forEach((n,j)=>itemCache.set('b:'+n,(r['x'+j]||[])[0]||null));}
    catch(e){chunk.forEach(n=>{if(!itemCache.has('b:'+n))itemCache.set('b:'+n,null);});}
    if(i+8<need.length)await new Promise(res=>setTimeout(res,250));
  }
  const out={};names.forEach(n=>{if(n)out[n]=itemCache.get('b:'+n)||null;});return out;
}

  const out={};

  if(!Object.keys(out).length){alert('Nothing to export yet — browse a few maps/pages first so data downloads, then export.');return;}

function keyTokens(n){
  n=(n||'').toLowerCase().replace(/\(key\)/g,'').replace(/ key\b.*/,'').replace(/ keycard\b.*/,'');
  const stop={the:1,room:1,spawn:1,guaranteed:1,and:1,with:1};
  const words=n.split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!stop[w]).sort((a,b)=>b.length-a.length);

/* ---- typo-tolerant matching ---- */
function levd(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  let prev=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){
    const cur=[i];let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best)best=cur[j];
    }
    if(best>max)return max+1;
    prev=cur;
  }
  return prev[b.length];
}
function fz(text,q){
  const T=(text||'').toLowerCase(),Q=(q||'').toLowerCase().trim();
  if(!Q)return false;
  if(T.includes(Q))return true;
  const words=T.split(/[^a-z0-9а-я#]+/i).filter(Boolean);
  const toks=Q.split(/[^a-z0-9а-я#]+/i).filter(Boolean);
  return toks.every(tok=>words.some(w=>{
    if(w.startsWith(tok))return true;
    if(tok.length>=4&&(levd(w.slice(0,tok.length),tok,1)<=1||levd(w.slice(0,tok.length+1),tok,1)<=1))return true;
    if(tok.length>=5&&levd(w,tok,2)<=2)return true;
    return false;
  }));
}

/* ============ CRS ============ */
function makeCRS(cfg){
  const th=(cfg.rot||0)*Math.PI/180,c=Math.cos(th),s=Math.sin(th);
  return L.extend({},L.CRS.Simple,{
    transformation:new L.Transformation(cfg.t[0],cfg.t[1],-cfg.t[2],cfg.t[3]),
    projection:{
      project:ll=>{const x=ll.lng,y=ll.lat;return L.point(x*c-y*s,x*s+y*c);},
      unproject:pt=>{const rx=pt.x,ry=pt.y;return L.latLng(-rx*s+ry*c,rx*c+ry*s);},
      bounds:L.bounds([-4000,-4000],[4000,4000])
    }
  });
}
/* ============ API ============ */
async function gql(query){
  /* 12s hard timeout — a busy API must fail fast so saved data can take over, never hang the app */
  const ac=new AbortController();
  const to=setTimeout(()=>ac.abort(),12000);
  try{
    /* GET first: a "simple" CORS request with NO preflight — survives API-side bot/CORS tightening
       that can reject cross-origin JSON POSTs even while the API itself is healthy. */
    try{
      const r=await fetch('https://api.tarkov.dev/graphql?query='+encodeURIComponent(query),{signal:ac.signal});
      if(r.ok){const j=await r.json();if(j&&!j.errors&&j.data)return j.data;}
    }catch(e){}
    /* fallback: classic POST */
    const r2=await fetch('https://api.tarkov.dev/graphql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query}),signal:ac.signal});
    const j2=await r2.json();
    if(j2.errors)throw new Error((j2.errors[0]&&j2.errors[0].message)||'API returned an error');
    return j2.data;
  }finally{clearTimeout(to);}
}

async function loadMapData(cfg){
  const ck='tkm_c5_'+cfg.id;
  /* SAVED-DATA-FIRST: any cached copy renders INSTANTLY; a stale one refreshes silently in the background.
     The network is only waited on when this map has never been loaded before. */
  let cached=null;
  try{cached=JSON.parse(packGet(ck)||'null');}catch(e){}
  if(!cached){try{cached=JSON.parse(packGet('tkm_c4_'+cfg.id)||'null');}catch(e){}}
  if(cached&&cached.d){
    if(Date.now()-cached.ts<43200000){S.staleData=false;return cached.d;}
    S.staleData=true;
    (async()=>{ /* background revalidate — next open of this map is fresh */
      for(const n of cfg.api){
        try{const r=await gql(MAP_Q(n));if(r.maps&&r.maps.length){safeSet(ck,JSON.stringify({ts:Date.now(),d:r.maps[0]}));const w=document.getElementById('netwarn');if(w&&w.className==='nw-info')w.style.display='none';return;}}catch(e){}
      }
    })();
    return cached.d;
  }
  /* first-ever visit to this map: two quick attempts, then honest error */
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  for(let attempt=0;attempt<2;attempt++){
    if(attempt)await wait(2000);
    for(const n of cfg.api){
      try{const r=await gql(MAP_Q(n));if(r.maps&&r.maps.length){const d=r.maps[0];S.staleData=false;try{safeSet(ck,JSON.stringify({ts:Date.now(),d}));}catch(e){}return d;}}catch(e){console.warn('map query',n,e);}
    }
  }
  /* API down: on the hosted site, seed from the repo's bundled datapack and retry the cache */
  if(await seedFromSite()){
    try{const c=JSON.parse(packGet(ck)||'null');if(c&&c.d){S.staleData=true;return c.d;}}catch(e){}
  }
  return null;
}
async function loadTasks(){
  if(S.tasks)return S.tasks;
  let c=null;try{c=JSON.parse(packGet('tkm_tasks3')||'null');}catch(e){}
  if(c&&c.d){
    S.tasks=c.d;
    if(Date.now()-c.ts>=43200000)(async()=>{try{const r=await gql(TASKS_Q);S.tasks=r.tasks;safeSet('tkm_tasks3',JSON.stringify({ts:Date.now(),d:r.tasks}));}catch(e){}})();
    return c.d;
  }
  try{
    const r=await gql(TASKS_Q);S.tasks=r.tasks;
    try{safeSet('tkm_tasks3',JSON.stringify({ts:Date.now(),d:r.tasks}));}catch(e){}
    return r.tasks;
  }catch(e){console.warn('tasks query failed',e);S.tasks=[];return [];}
}
/* ============ SPAWN CLUSTERING ============ */
function clusterSpawns(spawns){
  const pts=spawns.filter(s=>s.categories&&s.categories.includes('player')&&s.sides&&(s.sides.includes('pmc')||s.sides.includes('all'))).map(s=>s.position);
  const cl=[];
  pts.forEach(p=>{
    const c=cl.find(c=>Math.hypot(c.x-p.x,c.z-p.z)<25);
    if(c){c.n++;c.x=(c.x*(c.n-1)+p.x)/c.n;c.z=(c.z*(c.n-1)+p.z)/c.n;}
    else cl.push({x:p.x,z:p.z,n:1});
  });
  return cl;
}

let trackTimer=null,trackDir=null,trackSeen=null,trackLast=null,trackMk=null;
async function trackToggle(){
  const btn=document.getElementById('trkbtn');
  if(trackTimer){clearInterval(trackTimer);trackTimer=null;trackDir=null;if(trackMk&&S.leaf){S.leaf.removeLayer(trackMk);}trackMk=null;if(btn){btn.classList.remove('on');btn.textContent='📡 Track me';}return;}
  if(!window.showDirectoryPicker){alert('Live tracking needs Chrome or Edge (folder-watch support). Firefox/Safari can\'t do this from a local file.');return;}
  try{trackDir=await window.showDirectoryPicker();}catch(e){return;}
  trackSeen=new Set();trackLast=null;
  try{for await(const entry of trackDir.keys())trackSeen.add(entry);}catch(e){}
  if(btn){btn.classList.add('on');btn.textContent='📡 Tracking…';}
  alert('Tracking armed. ✔\n\nFOLDER TO PICK (pick the folder itself, not a file inside):\nC:\\Users\\<your name>\\Documents\\Escape from Tarkov\\Screenshots\n(Chrome will ask to "view files" — click Allow. Permission lasts until you close the browser.)\n\nIn raid: tap your SCREENSHOT key — your position appears here in ~3s, and if a Mission Focus is active the route AUTO-REDRAWS from where you are.\n\nPro tip: in Tarkov settings → Controls, REBIND Screenshot to a mouse side-button. One thumb-tap = map updates.');
  trackTimer=setInterval(trackScan,2500);
}
async function trackScan(){
  if(!trackDir||!S.leaf)return;
  try{
    let newest=null;
    for await(const name of trackDir.keys()){
      if(trackSeen.has(name))continue;
      trackSeen.add(name);
      const m=String(name).match(/_(-?\d+(?:\.\d+)?), (-?\d+(?:\.\d+)?), (-?\d+(?:\.\d+)?)_/);
      if(m)newest={x:+m[1],z:+m[3]};
    }
    if(!newest)return;
    const ll=[newest.z,newest.x];
    const b=S.cfg.bounds;
    const inX=newest.x>=Math.min(b[0][0],b[1][0])-60&&newest.x<=Math.max(b[0][0],b[1][0])+60;
    const inZ=newest.z>=Math.min(b[0][1],b[1][1])-60&&newest.z<=Math.max(b[0][1],b[1][1])+60;
    if(!inX||!inZ){const fb=document.getElementById('focusbar');fb.innerHTML='📡 Screenshot position is outside this map — are you on the right map tab? <u onclick="document.getElementById(\'focusbar\').style.display=\'none\'">✕</u>';fb.style.display='block';return;}
    let rot=0;
    if(trackLast){
      const a=S.leaf.latLngToContainerPoint(L.latLng(trackLast[0],trackLast[1]));
      const c=S.leaf.latLngToContainerPoint(L.latLng(ll[0],ll[1]));
      rot=Math.atan2(c.y-a.y,c.x-a.x)*180/Math.PI+90;
    }
    trackLast=ll;
    if(trackMk)S.leaf.removeLayer(trackMk);
    trackMk=L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="youdot"><div class="youarrow" style="transform:rotate(${rot}deg)">▲</div>YOU</div>`,iconSize:[46,46],iconAnchor:[23,23]}),zIndexOffset:2000,interactive:false});
    trackMk.addTo(S.leaf);
    if(!S.leaf.getBounds().contains(L.latLng(ll[0],ll[1])))S.leaf.setView(ll);
    if(S.focus&&S.focusPts.length)drawGuide(ll); /* auto-reroute from live position */
  }catch(e){console.warn('track',e);}
}

let logTimer=null,logDir=null,logOffsets={};
const LOGMAP={bigmap:'customs',Sandbox_high:'ground-zero',Sandbox:'ground-zero',Interchange:'interchange',Woods:'woods',Shoreline:'shoreline',RezervBase:'reserve',Laboratory:'the-lab',Lighthouse:'lighthouse',TarkovStreets:'streets-of-tarkov',factory4_day:'factory',factory4_night:'factory',Labyrinth:'the-labyrinth',Terminal:'terminal'};
const LOGRE=new RegExp('\\b('+Object.keys(LOGMAP).join('|')+')\\b','g');
async function logToggle(){
  const btn=document.getElementById('logbtn');
  if(logTimer){clearInterval(logTimer);logTimer=null;logDir=null;if(btn){btn.classList.remove('on');btn.textContent='📜 Auto-map';}return;}
  if(!window.showDirectoryPicker){alert('Auto-map needs Chrome or Edge.');return;}
  try{logDir=await window.showDirectoryPicker();}catch(e){return;}
  logOffsets={};
  if(btn){btn.classList.add('on');btn.textContent='📜 Auto-map ✓';}
  alert('Auto-map armed. ✔\n\nFOLDER TO PICK — the game\'s top-level "Logs" folder (pick the FOLDER, not any file; you can\'t and don\'t need to click a specific log file — I automatically find the newest log_... subfolder and read its ...application.log inside):\n\n• Steam version:\nC:\\Program Files (x86)\\Steam\\steamapps\\common\\Escape from Tarkov\\Logs\n(or the same path in whichever drive your Steam library is on)\n\n• BSG launcher version:\nC:\\Battlestate Games\\EFT\\Logs\n\nClick Allow when Chrome asks. From then on: when a raid loads, this page switches to the correct map by itself within ~5s. Re-grant after restarting the browser.');
  logTimer=setInterval(logScan,5000);
}
async function logScan(){
  if(!logDir)return;
  try{
    let newest=null,newestName='';
    for await(const [name,h] of logDir.entries()){
      if(h.kind==='directory'&&name>newestName){newestName=name;newest=h;}
    }
    const dir=newest||logDir;
    for await(const [fname,fh] of dir.entries()){
      if(fh.kind!=='file'||!/application/i.test(fname))continue;
      const f=await fh.getFile();
      const key=newestName+'/'+fname;
      const from=logOffsets[key]??Math.max(0,f.size-65536);
      if(f.size<=from){logOffsets[key]=f.size;continue;}
      const txt=await f.slice(from,f.size).text();
      logOffsets[key]=f.size;
      let mm,last=null;
      while((mm=LOGRE.exec(txt))!==null)last=mm[1];
      if(last&&LOGMAP[last]&&S.cfg&&LOGMAP[last]!==S.cfg.id){
        renderMap(LOGMAP[last],false);
        const fb=document.getElementById('focusbar');
        fb.innerHTML='📜 Raid detected — switched to <b>'+LOGMAP[last]+'</b> automatically. <u onclick="document.getElementById(\'focusbar\').style.display=\'none\'">✕</u>';
        fb.style.display='block';
      }
    }
  }catch(e){console.warn('logscan',e);}
}

function measureClick(ll){
  S.measure.pts.push(ll);
  if(S.measure.pts.length===1){document.getElementById('measureout').textContent='Click the second point…';document.getElementById('measureout').style.display='block';return;}
  const [a,c]=S.measure.pts;
  const d=Math.hypot(a.lat-c.lat,a.lng-c.lng);
  if(S.measure.line)S.leaf.removeLayer(S.measure.line);
  S.measure.line=L.polyline([a,c],{color:'#7dd3fc',weight:2,dashArray:'6 6'}).addTo(S.leaf);
  document.getElementById('measureout').textContent=`${d.toFixed(0)} m · ~${Math.ceil(d/6.5)}s sprint · ${Math.ceil(d/3.7)}s walk`;
  S.measure.pts=[];
}

/* BOOT: on the hosted site, a first-time visitor with no cached data gets seeded from the bundled
   datapack BEFORE anything renders — so the app is fully populated even while the live API is down. */
(async()=>{
  try{
    if(location.protocol==='https:'){
      /* ALWAYS arm the in-memory bundle on the hosted site — it backstops every loader,
         including browsers with partial/evicted storage (the "markers randomly missing" case) */
      const first=!packGet('tkm_tasks3');
      const w=document.getElementById('netwarn');
      if(first&&w){note('info','First visit - downloading the bundled game data (about 2 MB, a few seconds). After this the app opens instantly, even offline.');}
      await seedFromSite();
      if(first&&w)w.style.display='none';
    }
  }catch(e){}
  let start=packGet('tkm_last')||'ground-zero';
  /* if the starting map has no data yet and the API is unreachable, open one that does */
  try{if(!packGet('tkm_c5_'+start)){const m=MAPS.find(m=>packGet('tkm_c5_'+m.id));if(m)start=m.id;}}catch(e){}
  renderMap(start);
  squadLoop();if(S.squad)setTimeout(()=>squadSync(false),3000);
})();
/* PWA: when hosted (https), install the service worker for offline app-shell + map imagery caching. Harmless no-op on local file copies. */
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
</script>
